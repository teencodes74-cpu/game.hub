<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
  <title id="t">GameHub thumbnail</title>
  <desc id="d">Gradient abstract game card image.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g fill="white" fill-opacity="0.85" font-family="Verdana, sans-serif" text-anchor="middle">
    <text x="320" y="170" font-size="64">🎮</text>
    <text x="320" y="225" font-size="32">GameHub</text>
  </g>
</svg>
